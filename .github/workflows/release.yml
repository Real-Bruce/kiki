name: 发布 Windows 便携包

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    if: github.event.created
    runs-on: windows-2025
    steps:
      - name: 检出标签对应的源码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 构建并打包 Windows x64
        shell: pwsh
        run: ./scripts/Package-Windows.ps1 -Tag $env:GITHUB_REF_NAME

      - name: 发布 GitHub Release 和标签更新说明
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "dist/kiki-$tag-windows-x64.zip"
          gh release create $tag $zip "$zip.sha256" --verify-tag --title $tag --notes-from-tag
