[package]
name = "kiki"
version = "0.8.1"
edition = "2024"
rust-version = "1.88"

[features]
diagnostics = ["windows/Win32_System_ProcessStatus", "windows/Win32_System_SystemInformation", "windows/Win32_System_Diagnostics_ToolHelp"]

[dependencies]
windows-core = "=0.61.2"
windows-numerics = "=0.2.0"
windows = { version = "=0.61.3", features = [
  "Foundation", "UI_ViewManagement", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
  "Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_WinRT", "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_WinRT_Direct3D11", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_Ime", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging",
  "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_SystemInformation",
  "Win32_Security", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
